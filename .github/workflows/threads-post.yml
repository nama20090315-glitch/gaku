name: Threads Auto Post

on:
  schedule:
    # 毎週金曜夜21時に実行
    - cron: '0 21 * * 5'
  workflow_dispatch:

jobs:
  post-to-threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate and Post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_BUSINESS_ACCOUNT_ID: ${{ secrets.THREADS_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_to_threads.py
